<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tracker Randomlocke</title>
  <link rel="stylesheet" href="style.css?v=b3">
</head>
<body>
  <header class="cabecera">
    <div class="cabecera-dentro">
      <a class="marca" href="#/" aria-label="Ir a mis partidas">
        <span class="bola" aria-hidden="true"></span>
        <h1 class="logo">Tracker Randomlocke</h1>
      </a>
      <div id="estado" class="estado">
        <span id="estado-db" class="punto desconocido"></span>
        <span id="estado-texto">Comprobando...</span>
        <span id="estado-cache" class="punto desconocido"></span>
        <span id="estado-cache-texto">Caché</span>
      </div>
    </div>
  </header>

  <main>
    <p id="mensaje" role="alert"></p>

    <!-- Portada: las partidas como tarjetas -->
    <section id="vista-inicio" class="vista" hidden>
      <h2 class="titulo-seccion">Mis partidas</h2>
      <div id="rejilla" class="rejilla"></div>
    </section>

    <!-- Una partida: barra y tres columnas (equipo, vivos, cementerio) -->
    <section id="vista-partida" class="vista" hidden>
      <div class="barra">
        <a class="btn" href="#/">← Partidas</a>
        <h2 id="titulo-partida"></h2>
        <div id="contadores" class="contadores"></div>
        <button type="button" class="btn primario" id="abrir-registro">+ Nuevo encuentro</button>
      </div>

      <!-- Siempre tres columnas en horizontal: si no caben, la zona se desplaza hacia los lados -->
      <div class="scroll-h">
        <div class="tres">
          <div class="col-izq">
            <div class="panel-pokedex">
              <h2 class="titulo-panel">Equipo actual</h2>
              <div id="equipo" class="equipo"></div>
            </div>
          </div>
          <div class="panel-col">
            <h2 class="titulo-panel">Pokémon vivos</h2>
            <p id="info-cache" class="info"></p>
            <ul id="vivos" class="lista"></ul>
          </div>
          <div class="col-der">
            <div class="panel-col cementerio">
              <h2 class="titulo-panel">Cementerio</h2>
              <ul id="cementerio" class="lista"></ul>
            </div>
            <div class="panel-col fallos">
              <h2 class="titulo-panel">Fallos</h2>
              <ul id="fallos" class="lista"></ul>
            </div>
          </div>
        </div>
      </div>

    </section>
  </main>

  <!-- Ventana para crear una partida -->
  <dialog id="dialogo-nueva">
    <form id="form-run" method="dialog">
      <h3>Nueva partida</h3>
      <input id="nombre-run" placeholder="Nombre de la partida" maxlength="100" required autocomplete="off">
      <div class="botones">
        <button type="button" class="btn" id="cancelar-nueva">Cancelar</button>
        <button type="submit" class="btn primario">Crear</button>
      </div>
    </form>
  </dialog>

  <!-- Ventana para registrar un encuentro (captura o fallo); la muerte se marca desde la ficha -->
  <dialog id="dialogo-evento">
    <form id="form-evento">
      <h3>Nuevo encuentro</h3>
      <label class="campo">Resultado
        <select id="tipo-evento">
          <option value="captura">Captura</option>
          <option value="fallo">Fallo</option>
        </select>
      </label>
      <label class="campo">Ruta
        <input id="ruta" maxlength="100" required autocomplete="off">
      </label>
      <label class="campo">Especie
        <input id="especie" list="lista-especies" maxlength="100" required autocomplete="off">
        <datalist id="lista-especies"></datalist>
      </label>
      <label class="campo" id="campo-mote"><span>Mote <span class="opcional">(opcional)</span></span>
        <input id="mote" maxlength="20" autocomplete="off">
      </label>
      <p id="error-evento" class="error" role="alert"></p>
      <div class="botones">
        <button type="button" class="btn" id="cancelar-evento">Cancelar</button>
        <button type="submit" class="btn primario">Guardar</button>
      </div>
    </form>
  </dialog>

  <!-- Ficha del Pokémon: datos y acciones (ha muerto, revivir, equipo, eliminar) -->
  <dialog id="ficha" class="ficha">
    <div class="ficha-cabecera">
      <div id="ficha-dibujo" class="ficha-dibujo"></div>
      <div class="ficha-datos">
        <h3 id="ficha-nombre"></h3>
        <p id="ficha-sub" class="ficha-sub"></p>
        <div id="ficha-tipos" class="tipos"></div>
        <div id="ficha-estado" class="ficha-estado"></div>
      </div>
      <button type="button" class="cerrar" id="cerrar-ficha" aria-label="Cerrar">✕</button>
    </div>
    <p id="error-ficha" class="error ficha-error" role="alert"></p>
    <div id="ficha-acciones" class="ficha-acciones"></div>
  </dialog>

  <!-- Ventana para elegir un Pokémon vivo para un hueco del equipo -->
  <dialog id="selector" class="selector">
    <div class="selector-cabecera">
      <h3>Elige un Pokémon</h3>
      <button type="button" class="cerrar" id="cerrar-selector" aria-label="Cerrar">✕</button>
    </div>
    <ul id="selector-lista" class="lista selector-lista"></ul>
  </dialog>

  <script src="app.js?v=b3"></script>
</body>
</html>
