name: randomlocke-dev

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build: ./app
    ports:
      - "${WEB_PORT}:8000"
    environment:
      DB_HOST: ${DB_HOST}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      CACHE_ENABLED: ${CACHE_ENABLED}
      ENABLE_DOCS: ${ENABLE_DOCS}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - sprites:/app/static/sprites:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/status', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Herramienta de un solo uso (no arranca con "up"): descarga y recorta los dibujos en el volumen "sprites".
  # Uso: make sprites-{env}
  sprites:
    image: python:3.12-slim
    profiles: ["herramientas"]
    volumes:
      - sprites:/sprites
      - ./scripts/descargar_sprites.py:/descargar_sprites.py:ro
    command: ["sh", "-c", "pip install --no-cache-dir --quiet --root-user-action=ignore pillow==11.3.0 && python /descargar_sprites.py /sprites"]

volumes:
  pgdata:
  sprites:
