name: randomlocke-prod

services:
  db:
    image: postgres:16
    restart: unless-stopped
    networks:
      - backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    user: redis
    networks:
      - backend
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save \"\" --appendonly no"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    build: ./app
    restart: unless-stopped
    networks:
      - frontend
      - backend
    ports:
      - "${WEB_PORT}:8000"
    environment:
      DB_HOST: ${DB_HOST}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      CACHE_ENABLED: ${CACHE_ENABLED}
      CACHE_HOST: ${CACHE_HOST}
      ENABLE_DOCS: ${ENABLE_DOCS}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    volumes:
      - sprites:/app/static/sprites:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/status', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Herramienta de un solo uso (no arranca con "up"): descarga y recorta los dibujos en el volumen "sprites".
  # Uso: make sprites-{env}
  sprites:
    image: python:3.12-slim
    profiles: ["herramientas"]
    volumes:
      - sprites:/sprites
      - ./scripts/descargar_sprites.py:/descargar_sprites.py:ro
    command: ["sh", "-c", "pip install --no-cache-dir --quiet --root-user-action=ignore pillow==11.3.0 && python /descargar_sprites.py /sprites"]

volumes:
  pgdata:
  sprites:

networks:
  frontend:
  backend:
    internal: true
